
services:
  servicio-acceso:
    build: .
    container_name: servicio-acceso-lab
    restart: unless-stopped
    environment:
      - BROKER_HOST=host.docker.internal
      - BROKER_PORT=1883
      - PYTHONUNBUFFERED=1 # 👈 Esta línea hace que los print() salgan al instante
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./datos.db:/app/datos.db

