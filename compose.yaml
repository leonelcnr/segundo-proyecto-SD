services:

  mysql:
    image: mysql:5.7
    container_name: mysql-lab
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: a5wTJxnyhW
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: sp-sensores
      MYSQL_USER: admin-bd-proyecto
      MYSQL_PASSWORD: TMjJEKVznG7ZSAi

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - red-sp

  emqx:
    image: emqx/emqx:6.3.2
    container_name: emqx-lab
    restart: unless-stopped

    ports:
      - "1883:1883"    # MQTT
      - "8883:8883"    # MQTT con TLS
      - "8083:8083"    # MQTT sobre WebSocket
      - "8084:8084"    # MQTT WebSocket TLS
      - "18083:18083"  # Dashboard EMQX

    environment:
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/certs/propios/broker.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/certs/propios/broker.key
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /opt/emqx/etc/certs/propios/ca.crt

    volumes:
      - emqx_data:/opt/emqx/data
      - ./certs:/opt/emqx/etc/certs/propios:ro

    networks:
      - red-sp

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - mysql

volumes:
  mysql_data:
  emqx_data:


networks:
  red-sp:
    driver: bridge
