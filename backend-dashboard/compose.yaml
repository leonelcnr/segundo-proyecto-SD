services:
  receptor-dashboard:
    build: .
    container_name: receptor-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      # Las fechas del protocolo vienen en hora local sin zona: el server tiene que estar en la misma zona que el servicio
      TZ: America/Argentina/Buenos_Aires
    ports:
      # Solo en la IP de Tailscale del server; sin TAILSCALE_IP queda en localhost
      - "${TAILSCALE_IP:-127.0.0.1}:3000:3000"
    volumes:
      - dashboard-data:/app/data
      # La CA va dentro de la imagen igual (COPY .), esto deja cambiarla sin reconstruir
      - ./certs/ca.crt:/app/certs/ca.crt:ro

volumes:
  dashboard-data:
