services:
  receptor-dashboard:
    build: .
    container_name: receptor-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      # Las fechas del protocolo vienen en hora local sin zona: el server tiene que estar en la misma zona que el servicio
      TZ: America/Argentina/Buenos_Aires
    ports:
      # Solo en la IP del server en la red del laboratorio (sin IP_LAN queda en localhost).
      # Por ahí llegan los webhooks del broker y el reenvío de sd-2026 para el navegador del admin.
      - "${IP_LAN:-127.0.0.1}:${PUERTO:-3000}:3000"
    extra_hosts:
      # El certificado del broker dice broker.puertas: ese nombre apunta a la IP del broker en el laboratorio
      - "broker.puertas:${IP_BROKER:-127.0.0.1}"
    volumes:
      - dashboard-data:/app/data
      # La CA va dentro de la imagen igual (COPY .), esto deja cambiarla sin reconstruir
      - ./certs/ca.crt:/app/certs/ca.crt:ro

volumes:
  dashboard-data:
