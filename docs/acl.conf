%% ACL vigente en el broker (Control de acceso -> Autorizacion -> File).
%% Se carga en el panel de EMQX; "sin coincidencia" = deny y ademas termina en {deny, all}.
%% ${username} es el usuario MQTT, y el client ID tiene que ser igual (lo exige el autenticador MySQL).

%% Servicio central (Servidor 2)
{allow, {username, "servicio-central"}, subscribe, [{eq, "acceso/+/puerta/+/lectura"}, {eq, "acceso/+/puerta/+/presencia"}, {eq, "usuario/+/pedido"}]}.
{allow, {username, "servicio-central"}, publish, ["acceso/+/puerta/+/orden", "acceso/+/alarma", "acceso/+/estado", "acceso/+/eventos", "servicio/presencia", "usuario/+/aviso", "acceso/+/sala/+/ocupantes"]}.

%% Puertas (ESP32 y puerta virtual)
{allow, {username, {re, "^puerta-"}}, publish, ["acceso/+/puerta/${username}/lectura", "acceso/+/puerta/${username}/presencia", "acceso/+/puerta/${username}/telemetria"]}.
{allow, {username, {re, "^puerta-"}}, subscribe, ["acceso/+/puerta/${username}/orden", "acceso/+/alarma", "servicio/presencia"]}.

%% Servicio de salas (Servidor 4)
{allow, {username, "servicio-salas"}, subscribe, [{eq, "usuario/+/control"}, {eq, "acceso/+/sala/+/ocupantes"}]}.
{allow, {username, "servicio-salas"}, publish, ["sala/+/+/estado", "sala/+/+/telemetria", "sala/+/+/eventos", "servicio-salas/presencia", "usuario/+/respuesta"]}.

%% Admins (dashboard)
{allow, {username, {re, "^admin-"}}, publish, ["usuario/${username}/pedido"]}.
{allow, {username, {re, "^admin-"}}, subscribe, [{eq, "acceso/+/estado"}, {eq, "acceso/+/eventos"}, {eq, "acceso/+/alarma"}, {eq, "acceso/+/puerta/+/presencia"}, {eq, "acceso/+/puerta/+/telemetria"}, "servicio/presencia", "usuario/${username}/aviso", {eq, "acceso/+/sala/+/ocupantes"}, {eq, "sala/+/+/estado"}, {eq, "sala/+/+/telemetria"}, {eq, "sala/+/+/eventos"}, "servicio-salas/presencia"]}.

%% Celulares (app Android)
{allow, {username, {re, "^celular-"}}, publish, ["usuario/${username}/pedido", "usuario/${username}/control"]}.
{allow, {username, {re, "^celular-"}}, subscribe, ["usuario/${username}/aviso", "usuario/${username}/respuesta", {eq, "sala/+/+/estado"}, "servicio-salas/presencia"]}.

%% Todo lo demas, prohibido
{deny, all}.
