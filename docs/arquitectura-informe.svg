<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>

  <!-- Red de la facultad -->
  <rect x="300" y="100" width="870" height="650" rx="10" fill="#f7f9fc" stroke="#9aa7b8" stroke-dasharray="6 4"/>
  <text x="315" y="740" font-size="13" fill="#5b6b7f" font-weight="bold">Red de la facultad (10.51.2.x, compartida con otros grupos)</text>

  <!-- Navegador y sd-2026 -->
  <rect x="30" y="20" width="220" height="50" rx="6" fill="#fff" stroke="#333"/>
  <text x="140" y="42" text-anchor="middle" font-size="13" font-weight="bold">Navegador</text>
  <text x="140" y="59" text-anchor="middle" font-size="11">docentes / admin (con Tailscale)</text>
  <rect x="300" y="20" width="870" height="55" rx="6" fill="#fff" stroke="#333"/>
  <text x="735" y="41" text-anchor="middle" font-size="13" font-weight="bold">sd-2026 (Tailscale, de la cátedra, compartida con otros grupos)</text>
  <text x="735" y="58" text-anchor="middle" font-size="11">reenvía un puerto por servidor: 18106 → dashboard (alumno06) · 18107 → broker (alumno07)</text>
  <text x="735" y="71" text-anchor="middle" font-size="10" fill="#b45f06">a confirmar: dónde corre sslh, que separa el panel (HTTP) del MQTT TLS en 18107</text>
  <line x1="250" y1="40" x2="300" y2="40" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Puertas -->
  <rect x="30" y="140" width="220" height="200" rx="8" fill="#fff" stroke="#333"/>
  <text x="140" y="162" text-anchor="middle" font-size="14" font-weight="bold">Puertas (ESP32)</text>
  <rect x="45" y="175" width="190" height="60" rx="5" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="140" y="197" text-anchor="middle" font-size="12" font-weight="bold">puerta-hall</text>
  <text x="140" y="215" text-anchor="middle" font-size="11">ESP32-S3 + PN532 (tarjeta o celular)</text>
  <rect x="45" y="250" width="190" height="60" rx="5" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="140" y="272" text-anchor="middle" font-size="12" font-weight="bold">puerta-servidores</text>
  <text x="140" y="290" text-anchor="middle" font-size="11">ESP32 + RC522 + LCD (tarjeta)</text>
  <text x="140" y="330" text-anchor="middle" font-size="10">no decide: lee y obedece la orden</text>

  <!-- Raspberry -->
  <rect x="30" y="400" width="220" height="110" rx="8" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="140" y="422" text-anchor="middle" font-size="14" font-weight="bold">Raspberry (relay socat)</text>
  <text x="140" y="442" text-anchor="middle" font-size="11">:8883 en el Wi-Fi de las puertas</text>
  <text x="140" y="458" text-anchor="middle" font-size="11">reenvía los bytes por Tailscale</text>
  <text x="140" y="474" text-anchor="middle" font-size="11">no abre el TLS (punta a punta)</text>
  <text x="140" y="494" text-anchor="middle" font-size="10">relay-puertas.local</text>
  <line x1="140" y1="340" x2="140" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="148" y="375" font-size="10">MQTT / TLS (Wi-Fi)</text>

  <!-- App celular -->
  <rect x="30" y="550" width="220" height="100" rx="8" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="140" y="572" text-anchor="middle" font-size="14" font-weight="bold">App Android</text>
  <text x="140" y="590" text-anchor="middle" font-size="11">celular-1, 2, 3 · credencial NFC</text>
  <text x="140" y="606" text-anchor="middle" font-size="11">avisos "¿Fuiste vos?" y control</text>
  <text x="140" y="622" text-anchor="middle" font-size="11">de las salas · TLS, con Tailscale</text>

  <!-- Troncal Tailscale: Raspberry y celulares hacia sd-2026 -->
  <polyline points="250,455 275,455 275,60 300,60" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="250,600 275,600 275,455" fill="none" stroke="#333" stroke-width="1.5"/>
  <text transform="translate(267,300) rotate(-90)" text-anchor="middle" font-size="10">Tailscale</text>

  <!-- alumno07 -->
  <rect x="330" y="130" width="310" height="340" rx="8" fill="#fff" stroke="#333"/>
  <text x="520" y="150" text-anchor="middle" font-size="14" font-weight="bold">alumno07 · Broker</text>
  <rect x="350" y="160" width="270" height="105" rx="5" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="485" y="180" text-anchor="middle" font-size="13" font-weight="bold">EMQX 6.3.2</text>
  <text x="485" y="198" text-anchor="middle" font-size="11">MQTT TLS 8883 · panel 18083</text>
  <text x="485" y="214" text-anchor="middle" font-size="11">Autenticación: 1° JWT (RS256, clave pública)</text>
  <text x="485" y="229" text-anchor="middle" font-size="11">2° MySQL (client ID = usuario)</text>
  <text x="485" y="245" text-anchor="middle" font-size="11">Autorización: ACL archivo, deny por defecto</text>
  <rect x="350" y="285" width="130" height="70" rx="5" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="415" y="308" text-anchor="middle" font-size="12" font-weight="bold">MySQL 5.7</text>
  <text x="415" y="325" text-anchor="middle" font-size="11">tabla mqtt_user</text>
  <text x="415" y="341" text-anchor="middle" font-size="11">(usuarios MQTT)</text>
  <rect x="490" y="285" width="130" height="70" rx="5" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="555" y="308" text-anchor="middle" font-size="12" font-weight="bold">phpMyAdmin</text>
  <text x="555" y="325" text-anchor="middle" font-size="11">puerto 8080</text>
  <text x="555" y="341" text-anchor="middle" font-size="11">solo desde la red interna</text>
  <line x1="415" y1="265" x2="415" y2="285" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="320" x2="490" y2="320" stroke="#333" stroke-width="1.5"/>
  <rect x="350" y="375" width="270" height="75" rx="5" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="485" y="396" text-anchor="middle" font-size="12" font-weight="bold">Reglas (4) → WebHook</text>
  <text x="485" y="413" text-anchor="middle" font-size="11">conexiones · seguridad (ACL deny)</text>
  <text x="485" y="429" text-anchor="middle" font-size="11">alarmas · temperatura &gt; 27 °C</text>

  <!-- sd-2026 -> EMQX -->
  <line x1="380" y1="75" x2="380" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="388" y="97" font-size="10">18107 → 8883 TLS</text>

  <!-- alumno04 -->
  <rect x="330" y="540" width="310" height="180" rx="8" fill="#fff" stroke="#333"/>
  <text x="485" y="560" text-anchor="middle" font-size="14" font-weight="bold">alumno04 · Servicio central</text>
  <rect x="350" y="575" width="270" height="130" rx="5" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="485" y="597" text-anchor="middle" font-size="12" font-weight="bold">servicio-acceso (Python)</text>
  <text x="485" y="614" text-anchor="middle" font-size="11">conecta como servicio-central (TLS 8883)</text>
  <text x="485" y="630" text-anchor="middle" font-size="11">decide accesos, salas anidadas, permanencia</text>
  <text x="485" y="646" text-anchor="middle" font-size="11">pedidos a admin / celular, alarmas</text>
  <text x="485" y="668" text-anchor="middle" font-size="11" font-weight="bold">SQLite datos.db (usuarios, historial)</text>
  <text x="485" y="685" text-anchor="middle" font-size="10">en memoria: ocupantes y pendientes</text>

  <!-- alumno06 -->
  <rect x="800" y="130" width="350" height="340" rx="8" fill="#fff" stroke="#333"/>
  <text x="975" y="150" text-anchor="middle" font-size="14" font-weight="bold">alumno06 · Dashboard</text>
  <rect x="820" y="160" width="310" height="170" rx="5" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="975" y="182" text-anchor="middle" font-size="12" font-weight="bold">Dashboard (React + backend)</text>
  <text x="975" y="200" text-anchor="middle" font-size="11">login con JWT en cookie (8 h)</text>
  <text x="975" y="216" text-anchor="middle" font-size="11">conecta al broker como admin-1</text>
  <text x="975" y="232" text-anchor="middle" font-size="11">con JWT RS256 que firma con su clave privada</text>
  <text x="975" y="248" text-anchor="middle" font-size="11">salas, solicitudes, historial, alarmas</text>
  <rect x="820" y="375" width="310" height="75" rx="5" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="975" y="397" text-anchor="middle" font-size="12" font-weight="bold">Receptor de webhooks</text>
  <text x="975" y="414" text-anchor="middle" font-size="11">/webhook/conexiones · seguridad</text>
  <text x="975" y="430" text-anchor="middle" font-size="11">alarmas · ambiente — valida X-Token</text>
  <line x1="975" y1="75" x2="975" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="983" y="92" font-size="10">18106</text>

  <!-- alumno08 -->
  <rect x="800" y="540" width="350" height="180" rx="8" fill="#fff" stroke="#333"/>
  <text x="975" y="560" text-anchor="middle" font-size="14" font-weight="bold">alumno08 · Servicio de salas</text>
  <rect x="820" y="575" width="310" height="130" rx="5" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="975" y="597" text-anchor="middle" font-size="12" font-weight="bold">servicio-salas (Python)</text>
  <text x="975" y="614" text-anchor="middle" font-size="11">conecta como servicio-salas (TLS 8883)</text>
  <text x="975" y="630" text-anchor="middle" font-size="11">dueño del ambiente: luz, cortina, aire,</text>
  <text x="975" y="646" text-anchor="middle" font-size="11">temperatura y aire de precisión (reglas)</text>
  <text x="975" y="668" text-anchor="middle" font-size="11" font-weight="bold">el celular pide, este servicio decide</text>
  <text x="975" y="685" text-anchor="middle" font-size="10">estado en el volumen "datos"</text>

  <!-- Flechas MQTT -->
  <polyline points="350,640 315,640 315,180 350,180" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="800" y1="195" x2="620" y2="195" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="710" y="187" text-anchor="middle" font-size="10">MQTT TLS · admin-1</text>
  <text x="710" y="212" text-anchor="middle" font-size="10">(JWT RS256)</text>
  <line x1="620" y1="412" x2="820" y2="412" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="745" y="400" text-anchor="middle" font-size="10">HTTP POST + X-Token</text>
  <polyline points="800,640 700,640 700,235 620,235" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Leyenda -->
  <rect x="30" y="680" width="250" height="140" rx="6" fill="#fff" stroke="#9aa7b8"/>
  <text x="45" y="702" font-size="12" font-weight="bold">Referencias</text>
  <line x1="45" y1="720" x2="85" y2="720" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="95" y="724" font-size="11">conexión (MQTT, HTTP o Tailscale)</text>
  <rect x="45" y="738" width="40" height="16" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="95" y="751" font-size="11">componente del repo</text>
  <text x="45" y="776" font-size="10">Todo MQTT usa TLS, usuario y clave propios,</text>
  <text x="45" y="790" font-size="10">y client ID igual al usuario.</text>
  <text x="45" y="808" font-size="10" fill="#b45f06">Naranja: dato a confirmar.</text>
</svg>
