
[env]
platform = espressif32 @ 6.13.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    256dpi/MQTT @ ^2.5.3
    bblanchon/ArduinoJson @ ^7.4.3

[clasica]
board = esp32dev
upload_speed = 115200
lib_deps =
    ${env.lib_deps}
    miguelbalboa/MFRC522 @ ^1.4.12
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
build_flags =
    -D PLACA_CLASICA -D LECTOR_RC522 -D CON_LCD
    -D PUERTA_ID=\"puerta-servidores\" -D MQTT_CLAVE=CLAVE_PUERTA_SERVIDORES

[s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit PN532 @ 1.3.4    ; versión fija: lector.h lee su buffer interno
build_flags =
    -D PLACA_S3 -D LECTOR_PN532 -D BOARD_HAS_PSRAM
    -D PUERTA_ID=\"puerta-hall\" -D MQTT_CLAVE=CLAVE_PUERTA_HALL

[env:prueba-clasica]
extends = clasica
build_src_filter = +<pruebas/>

[env:prueba-s3]
extends = s3
build_src_filter = +<pruebas/>

[env:puerta-servidores]
extends = clasica
build_src_filter = +<puerta/>

[env:puerta-hall]
extends = s3
build_src_filter = +<puerta/>
